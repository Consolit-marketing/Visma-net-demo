<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visma Net — Interactieve demo</title>
  <meta name="description" content="Probeer de basis van Visma Net zelf uit in een vrijblijvende sandbox met voorbeeldgegevens. Aangeboden door Consolit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">

    <!-- Brand corner -->
    <div class="brand">
      <svg viewBox="0 0 288 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#ff8e05" d="M223.43,111.861c-.01.29-.03.57-.06.85-.48,4.63-3.21,8.96-7.45,11.38,0,0-22.739,13.3-42.899,24.879-.86.43-1.72,1.08-2.57,1.51-8.11-4.68-20.589-11.78-27.819-15.97-5.15-3.25-8.44-8.93-8.44-15.21v-49.989c0-.16,0-.31.02-.47,0-.14.01-.27.03-.41.01-.15.03-.31.06-.46.02-.16.05-.31.08-.46.02-.15.06-.29.1-.44.65-2.49,2.32-4.46,4.44-5.59.98-.51,2.05-.84,3.16-.97.86-.09,1.75-.06,2.63.11.94.19,1.87.53,2.78,1.05l68.428,39.469c.8.5,1.54,1,2.23,1.52,3.18,2.4,5.11,5.15,5.28,9.2Z"/>
        <path fill="#ffffff" d="M153.809,164.121v54.485c0,6.864-7.294,11.161-13.299,7.724l-68.428-39.467c-4.501-2.793-7.294-5.79-7.509-10.721.215-4.941,3.008-9.657,7.509-12.235,0,0,22.741-13.299,42.904-24.879.859-.43,1.719-1.074,2.568-1.504,9.657,5.575,25.534,14.588,31.324,18.025,2.997,1.708,4.931,4.931,4.931,8.573Z"/>
        <path fill="#ffffff" d="M64.6,176.489c.3-5.01,3.04-9.54,7.48-12.16,0,0,22.739-13.09,42.909-24.669,1.05-.61,2.09-1.22,3.12-1.82,14.56-8.45,26.909-15.56,26.909-15.56,5.36-3.22,8.8-9.01,8.8-15.44v-49.989c0-3.21-1.72-6.22-4.51-7.72-2.57-1.51-6.01-1.51-8.8,0l-16.51,9.44-51.919,30.039c-4.71,2.78-7.51,7.71-7.51,13.08v74.448l.03.35Z"/>
        <path fill="#ff8e05" d="M223.399,111.471c-.28,5.03-3.02,9.57-7.48,12.2,0,0-22.739,13.09-42.899,24.669-1.05.61-2.09,1.22-3.12,1.82-14.57,8.45-26.919,15.56-26.919,15.56-7.52,4.54-8.8,5.39-8.8,15.44v49.989c0,3.21,1.72,6.22,4.51,7.72,2.57,1.51,6.01,1.51,8.8,0l16.51-9.44,51.919-30.039c4.72-2.78,7.51-7.71,7.51-13.08v-74.448l-.03-.39Z"/>
      </svg>
      <span class="brand-name">Visma Net</span>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="crumbs" id="crumbs"><b>Dashboard</b></div>
      <div class="spacer"></div>
      <span class="demo-badge"><span class="dot"></span>Demo · voorbeeldgegevens</span>
      <div class="company-chip">
        <div class="avatar">NO</div>
        <div class="meta">
          <div class="n">Noordzee Outdoor B.V.</div>
          <div class="s">Boekjaar 2025 · EUR</div>
        </div>
      </div>
    </header>

    <!-- Sidebar nav -->
    <nav class="nav" id="nav">
      <div class="nav-group-label">Overzicht</div>
      <button class="nav-item active" data-view="dashboard" data-tour="nav-dashboard">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </button>

      <div class="nav-group-label">Verkoop</div>
      <button class="nav-item" data-view="sales" data-tour="nav-sales">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.3a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L23 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        Verkooporders
      </button>

      <div class="nav-group-label">Inkoop</div>
      <button class="nav-item" data-view="purchase" data-tour="nav-purchase">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4z"/><path d="M4 8v12h16V8"/><path d="M9 12h6"/></svg>
        Inkoopfacturen
        <span class="pill" id="nav-approve-count">0</span>
      </button>

      <div class="nav-group-label">Meer in Visma Net</div>
      <button class="nav-item disabled" title="Niet in deze demo — vraag Consolit naar een volledige demo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
        Grootboek <span class="soon">Volledig</span>
      </button>
      <button class="nav-item disabled" title="Niet in deze demo — vraag Consolit naar een volledige demo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>
        Voorraad &amp; Logistiek <span class="soon">Volledig</span>
      </button>
      <button class="nav-item disabled" title="Niet in deze demo — vraag Consolit naar een volledige demo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>
        HRM &amp; Payroll <span class="soon">Volledig</span>
      </button>
    </nav>

    <!-- Main -->
    <main class="main" id="main">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-sales"></section>
      <section class="view" id="view-purchase"></section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="pw"><span class="dot"></span>Powered by Visma Net</div>
      <div class="by">
        <span>Demo aangeboden door</span>
        <span class="consolit-logo">Consol<span>i</span>t</span>
        <a href="#" data-cta-link target="_blank" rel="noopener">Plan een persoonlijke demo →</a>
      </div>
    </footer>
  </div>

  <!-- Generic overlay host (modals injected by JS) -->
  <div class="overlay" id="overlay"><div id="overlay-content"></div></div>

  <!-- Tour host -->
  <div class="tour-spot" id="tour-spot" style="display:none"></div>
  <div class="tour-pop" id="tour-pop" style="display:none"></div>

  <!-- Toasts -->
  <div class="toast-stack" id="toasts"></div>

  <script src="assets/app.js"></script>
</body>
</html>
