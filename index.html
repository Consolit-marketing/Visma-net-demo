<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visma Net — Interactieve demo</title>
  <meta name="description" content="Probeer de basis van Visma Net zelf uit in een vrijblijvende sandbox met voorbeeldgegevens. Aangeboden door Consolit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">

    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <button class="ham" id="ham" aria-label="Menu" data-tour="ham">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="home-btn" data-nav="dashboard" aria-label="Home">
        <svg viewBox="0 0 24 24" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="top-right">
        <div class="company-pill">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>
          <span class="cp-name">Noordzee Outdoor B.V. - Noordwijk</span>
        </div>
        <button class="top-btn">Feedback</button>
        <button class="icon-btn" aria-label="Assistent"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/></svg></button>
        <button class="icon-btn" aria-label="Help"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg></button>
      </div>
    </header>

    <!-- ============ FLYOUT MENU ============ -->
    <div class="flyout-backdrop" id="flyout-backdrop"></div>
    <aside class="flyout" id="flyout">
      <div class="flyout-head">
        <span class="fh-logo">
          <svg viewBox="0 0 288 288" aria-hidden="true"><path fill="#ff8e05" d="M223.43,111.861c-.01.29-.03.57-.06.85-.48,4.63-3.21,8.96-7.45,11.38,0,0-22.739,13.3-42.899,24.879-.86.43-1.72,1.08-2.57,1.51-8.11-4.68-20.589-11.78-27.819-15.97-5.15-3.25-8.44-8.93-8.44-15.21v-49.989c0-.16,0-.31.02-.47,0-.14.01-.27.03-.41.65-2.49,2.32-4.46,4.44-5.59.98-.51,2.05-.84,3.16-.97.86-.09,1.75-.06,2.63.11.94.19,1.87.53,2.78,1.05l68.428,39.469c.8.5,1.54,1,2.23,1.52,3.18,2.4,5.11,5.15,5.28,9.2Z"/><path fill="#003253" d="M153.809,164.121v54.485c0,6.864-7.294,11.161-13.299,7.724l-68.428-39.467c-4.501-2.793-7.294-5.79-7.509-10.721.215-4.941,3.008-9.657,7.509-12.235,0,0,22.741-13.299,42.904-24.879.859-.43,1.719-1.074,2.568-1.504,9.657,5.575,25.534,14.588,31.324,18.025,2.997,1.708,4.931,4.931,4.931,8.573Z"/><path fill="#003253" d="M64.6,176.489c.3-5.01,3.04-9.54,7.48-12.16,0,0,22.739-13.09,42.909-24.669,1.05-.61,2.09-1.22,3.12-1.82,14.56-8.45,26.909-15.56,26.909-15.56,5.36-3.22,8.8-9.01,8.8-15.44v-49.989c0-3.21-1.72-6.22-4.51-7.72-2.57-1.51-6.01-1.51-8.8,0l-16.51,9.44-51.919,30.039c-4.71,2.78-7.51,7.71-7.51,13.08v74.448l.03.35Z"/><path fill="#ff8e05" d="M223.399,111.471c-.28,5.03-3.02,9.57-7.48,12.2,0,0-22.739,13.09-42.899,24.669-1.05.61-2.09,1.22-3.12,1.82-14.57,8.45-26.919,15.56-26.919,15.56-7.52,4.54-8.8,5.39-8.8,15.44v49.989c0,3.21,1.72,6.22,4.51,7.72,2.57,1.51,6.01,1.51,8.8,0l16.51-9.44,51.919-30.039c4.72-2.78,7.51-7.71,7.51-13.08v-74.448l-.03-.39Z"/></svg>
          Visma Net
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </div>
      <div class="flyout-search">
        <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Zoeken" aria-label="Zoeken" />
        <span class="kbd">Ctrl+O</span>
      </div>
      <div class="flyout-list" id="flyout-list"></div>
      <div class="flyout-foot">
        <div class="edit"><svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9"/><path d="M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Menu bewerken</div>
        <div class="flyout-user">
          <div class="av">BR</div>
          <div class="uinfo"><div class="n">Bart de Ruiter</div><div class="e">bderuiter@consolit.nl</div></div>
        </div>
      </div>
    </aside>

    <!-- ============ CONTENT ============ -->
    <main class="content" id="content">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-sales"></section>
      <section class="view" id="view-order"></section>
      <section class="view" id="view-purchase"></section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
      <div class="pw"><span class="dot"></span>Powered by Visma Net</div>
      <span class="demo-flag"><span class="d"></span>Demo · voorbeeldgegevens</span>
      <div class="by">
        <span>Demo aangeboden door</span>
        <span class="consolit-logo">Consol<span>i</span>t</span>
        <a href="#" data-cta-link target="_blank" rel="noopener">Plan een persoonlijke demo →</a>
      </div>
    </footer>
  </div>

  <div class="overlay" id="overlay"><div id="overlay-content"></div></div>
  <div class="tour-spot" id="tour-spot" style="display:none"></div>
  <div class="tour-pop" id="tour-pop" style="display:none"></div>
  <div class="toast-stack" id="toasts"></div>

  <script src="assets/app.js"></script>
</body>
</html>
